name: Build EX2 Ultra kernel

on:
  push:
    branches: [codex/linux-6.12-lts]
    paths:
      - build.sh
      - inc/kernel.sh
      - inc/helpers.sh
      - config/**
      - dts/**
      - tools/**
      - .github/workflows/compile-kernel.yml
  workflow_dispatch:
    inputs:
      kernelversion:
        description: Official stable branch or tag
        required: true
        default: v6.12.118
        type: string

permissions:
  contents: read

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf build-essential bc bison flex libssl-dev libelf-dev libncurses-dev u-boot-tools python3
      - name: Check scripts and hardware controller
        run: |
          bash -n build.sh inc/kernel.sh inc/helpers.sh tools/check-boot-config.sh
          python3 -B -m unittest discover -s hardware -v
      - name: Build kernel, board DTB and modules
        env:
          KERNEL_REF: ${{ inputs.kernelversion || 'v6.12.118' }}
        run: ./build.sh --ghrunner --kernel --clean --kernelbranch "$KERNEL_REF"
      - name: Verify trial archive and checksums
        run: |
          release=$(cat output/kernel-release)
          cd output
          sha256sum -c "SHA256SUMS-$release"
          tar -tzf "boot-$release.tar.gz"
          if [[ $release == 6.12.* ]]; then
            ! tar -tzf "boot-$release.tar.gz" | grep -Ex 'boot/(uImage|uRamdisk)'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wd-ex2-ultra-kernel
          if-no-files-found: error
          retention-days: 30
          path: |
            output/*.tar.gz
            output/build-*.json
            output/SHA256SUMS-*
            output/kernel-release
